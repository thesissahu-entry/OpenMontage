name: Send Bulk Email

# Triggers the workflow at 9:00 AM Italian time (7:00 UTC)
on:
  schedule:
    - cron: '0 7 * * *'  # At 07:00 UTC every day

# Also allow manual trigger from the Actions tab
workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      
      - name: Send bulk email
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          EMAIL_SUBJECT: ${{ secrets.EMAIL_SUBJECT }}
          EMAIL_BODY: ${{ secrets.EMAIL_BODY }}
          EMAIL_BODY_HTML: ${{ secrets.EMAIL_BODY_HTML }}
          TOTAL_EMAILS: '250'  # Send 250 emails for the actual run
          DELAY_MIN: '1.0'
          DELAY_MAX: '2.5'
        run: |
          python send_bulk_email.py
